<div class="milestone-card" [class.card-completed]="milestone().isCompleted" [class.card-delayed]="isOverdue()">
  <!-- Header -->
  <div class="card-header">
    <div class="status-badge" [class]="statusClass()">
      {{ statusLabel() }}
    </div>
    <button
      *ngIf="canDelete()"
      class="btn-delete"
      (click)="onDelete()"
      title="Eliminar hito">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      </svg>
    </button>
  </div>

  <!-- Title -->
  <h3 class="card-title">{{ milestone().title.getValue() }}</h3>

  <!-- Description -->
  <p class="card-description">{{ shortDescription() }}</p>

  <!-- Due Date -->
  <div class="due-date" [class.overdue]="isOverdue()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <polyline points="12 6 12 12 16 14"/>
    </svg>
    <span>Vence: {{ formattedDueDate() }}</span>
  </div>

  <!-- Tasks Progress -->
  <div class="tasks-section">
    <div class="tasks-header">
      <span class="tasks-label">Tareas</span>
      <span class="tasks-count">{{ completedTasks() }}/{{ totalTasks() }}</span>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar" [style.width.%]="tasksProgress()"></div>
    </div>
  </div>

  <!-- Footer -->
  <div class="card-footer">
    <button class="btn-view" (click)="onViewDetails()">
      <span>Ver Detalles</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </button>
  </div>
</div>
