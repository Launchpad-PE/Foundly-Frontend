<div class="modal-overlay" *ngIf="isOpen()" (click)="onBackdropClick($event)">
  <div class="modal-container">
    <div class="modal-header">
      <h3>Cambiar fecha del hito</h3>
      <button class="btn-close" (click)="onClose()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Nueva fecha de entrega</label>
        <input type="date" [(ngModel)]="newDueDate" [min]="minDate">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" (click)="onClose()">Cancelar</button>
      <button class="btn-save" (click)="saveNewDueDate()" [disabled]="!newDueDate">
        Guardar
      </button>
    </div>
  </div>
</div>
