<div class="modal-overlay" *ngIf="isOpen()" (click)="onBackdropClick($event)">
  <div class="modal-container">
    <!-- Header -->
    <div class="modal-header">
      <h2>Crear Nuevo Hito</h2>
      <button class="btn-close" (click)="onClose()">×</button>
    </div>

    <!-- Body -->
    <div class="modal-body">
      <!-- Title -->
      <div class="form-group">
        <label>Título *</label>
        <input
          type="text"
          [(ngModel)]="title"
          placeholder="Ej: Fase 1 - Investigación"
          [class.invalid]="title && titleError()"
          maxlength="120">
        <div class="form-help">
          <span class="error" *ngIf="titleError()">{{ titleError() }}</span>
          <span class="counter">{{ title.length }}/120</span>
        </div>
      </div>

      <!-- Description -->
      <div class="form-group">
        <label>Descripción *</label>
        <textarea
          [(ngModel)]="description"
          rows="4"
          placeholder="Describe los objetivos de este hito..."
          [class.invalid]="description && descriptionError()"
          maxlength="2000"></textarea>
        <div class="form-help">
          <span class="error" *ngIf="descriptionError()">{{ descriptionError() }}</span>
          <span class="counter">{{ description.length }}/2000</span>
        </div>
      </div>

      <!-- Due Date -->
      <div class="form-group">
        <label>Fecha de Entrega *</label>
        <input
          type="date"
          [(ngModel)]="dueDate"
          [min]="minDate">
      </div>

      <!-- Tools -->
      <div class="form-group">
        <label>Herramientas (opcional)</label>
        <div class="input-with-button">
          <input
            type="text"
            [(ngModel)]="currentTool"
            placeholder="Ej: Figma, GitHub, Slack"
            (keyup.enter)="addTool()">
          <button type="button" (click)="addTool()" [disabled]="!currentTool.trim()">
            Agregar
          </button>
        </div>
        <div class="tags-list" *ngIf="tools.length > 0">
          <span *ngFor="let tool of tools; let i = index" class="tag">
            {{ tool }}
            <button (click)="removeTool(i)">×</button>
          </span>
        </div>
      </div>

      <!-- Attachments -->
      <div class="form-group">
        <label>Adjuntos (URLs)</label>
        <div class="input-with-button">
          <input
            type="url"
            [(ngModel)]="currentAttachment"
            placeholder="https://..."
            (keyup.enter)="addAttachment()">
          <button type="button" (click)="addAttachment()" [disabled]="!currentAttachment.trim()">
            Agregar
          </button>
        </div>
        <div class="attachments-list" *ngIf="attachments.length > 0">
          <div *ngFor="let url of attachments; let i = index" class="attachment-item">
            <a [href]="url" target="_blank" rel="noopener">{{ truncateUrl(url) }}</a>
            <button (click)="removeAttachment(i)">×</button>
          </div>
        </div>
      </div>

      <!-- General Comment -->
      <div class="form-group">
        <label>Comentario General (opcional)</label>
        <textarea
          [(ngModel)]="generalComment"
          rows="3"
          placeholder="Instrucciones adicionales para el equipo..."></textarea>
      </div>
    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <button class="btn-cancel" (click)="onClose()">Cancelar</button>
      <button
        class="btn-create"
        (click)="onSubmit()"
        [disabled]="!isValid() || loading()">
        {{ loading() ? 'Creando...' : 'Crear Hito' }}
      </button>
    </div>
  </div>
</div>
