<div class="step-container">
  <h2>{{ 'project.step.env.title' | translate }}</h2>

  <div class="info-box">
    <span class="info-icon">🌱</span>
    <p>{{ 'project.step.env.activate' | translate }}</p>
  </div>

  <div class="form-group">
    <label class="checkbox-label">
      <input
        type="checkbox"
        [(ngModel)]="formData.hasEnvironmentalImpact"
        class="checkbox-input"
      />
      <span>{{ 'project.step.env.check' | translate }}</span>
    </label>
  </div>

  <div *ngIf="formData.hasEnvironmentalImpact" class="metrics-section">
    <h3>{{ 'project.step.env.select' | translate }}</h3>
    <div class="metrics-grid">
      <div
        *ngFor="let metric of environmentalMetrics"
        class="metric-card"
        [class.selected]="isSelected(metric.value)"
        (click)="toggleEnvironmentalMetric(metric.value)"
      >
        <div class="metric-icon">{{ metric.icon }}</div>
        <div class="metric-label">{{ metric.label }}</div>
        <div class="metric-check" *ngIf="isSelected(metric.value)">✓</div>
      </div>
    </div>
  </div>

  <div *ngIf="!formData.hasEnvironmentalImpact" class="info-message">
    <p>{{ 'project.step.env.skip' | translate }}</p>
  </div>
</div>
