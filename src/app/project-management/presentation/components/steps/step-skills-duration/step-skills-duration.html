<div class="step-container">
  <h2>{{ 'project.step.skills.title' | translate }}</h2>

  <!-- Nivel Académico -->
  <div class="form-group">
    <label for="academicLevel">{{ 'project.step.skills.academic' | translate }}</label>
    <select
      id="academicLevel"
      [(ngModel)]="formData.academicLevel"
      class="form-control"
    >
      <option [ngValue]="null">{{ 'project.step.skills.academicPlaceholder' | translate }}</option>
      <option *ngFor="let level of academicLevels" [value]="level">{{ level }}</option>
    </select>
  </div>

  <!-- Beneficios -->
  <div class="form-group">
    <label>{{ 'project.step.skills.benefits' | translate }}</label>
    <div class="tags-input">
      <div class="tags-list">
        <span *ngFor="let benefit of formData.benefits" class="tag">
          {{ benefit }}
          <button type="button" class="tag-remove" (click)="removeBenefit(benefit)">×</button>
        </span>
      </div>
      <div class="tag-input-group">
        <input
          type="text"
          [(ngModel)]="newBenefit"
          (keyup.enter)="addBenefit()"
          [placeholder]="'project.step.skills.benefitsPlaceholder' | translate"
          class="tag-input"
        />
        <button type="button" class="btn-add-tag" (click)="addBenefit()">{{ 'common.add' | translate }}</button>
      </div>
    </div>
  </div>

  <!-- Habilidades Requeridas -->
  <div class="form-group">
    <label>{{ 'project.step.skills.required' | translate }}</label>
    <div class="tags-input">
      <div class="tags-list">
        <span *ngFor="let skill of formData.requiredSkills" class="tag skill-tag">
          #{{ skill }}
          <button type="button" class="tag-remove" (click)="removeSkill(skill)">×</button>
        </span>
      </div>
      <div class="tag-input-group">
        <input
          type="text"
          [(ngModel)]="newSkill"
          (keyup.enter)="addSkill()"
          [placeholder]="'project.step.skills.requiredPlaceholder' | translate"
          class="tag-input"
        />
        <button type="button" class="btn-add-tag" (click)="addSkill()">{{ 'common.add' | translate }}</button>
      </div>
    </div>
  </div>

  <!-- Duración -->
  <div class="form-group">
    <label>{{ 'project.step.skills.duration' | translate }}</label>
    <div class="duration-group">
      <input
        type="number"
        [(ngModel)]="formData.durationAmount"
        (ngModelChange)="onDurationChange()"
        min="1"
        class="duration-amount"
      />
      <select
        [(ngModel)]="formData.durationType"
        (ngModelChange)="onDurationChange()"
        class="duration-type"
      >
        <option *ngFor="let type of durationTypes" [value]="type.value">{{ type.label }}</option>
      </select>
    </div>
  </div>
</div>
