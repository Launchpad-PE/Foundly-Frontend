<div class="step-container">
  <h2>{{ 'project.step.info.title' | translate }}</h2>

  <!-- Nombre del Proyecto -->
  <div class="form-group">
    <label for="projectName">{{ 'project.step.info.name' | translate }}</label>
    <input
      type="text"
      id="projectName"
      [(ngModel)]="formData.name"
      (ngModelChange)="onInputChange()"
      [placeholder]="'project.step.info.namePlaceholder' | translate"
      class="form-control"
      required
    />
  </div>

  <!-- Área -->
  <div class="form-group">
    <label for="area">{{ 'project.step.info.area' | translate }}</label>
    <select
      id="area"
      [(ngModel)]="formData.area"
      (ngModelChange)="onInputChange()"
      class="form-control"
      required
    >
      <option value="">{{ 'project.step.info.areaPlaceholder' | translate }}</option>
      <option *ngFor="let area of availableAreas" [value]="area">{{ area }}</option>
    </select>
  </div>

  <!-- Etiquetas/Tags -->
  <div class="form-group">
    <label>{{ 'project.step.info.tags' | translate }}</label>
    <div class="tags-input">
      <div class="tags-list">
        <span *ngFor="let tag of formData.tags" class="tag">
          #{{ tag }}
          <button type="button" class="tag-remove" (click)="removeTag(tag)">×</button>
        </span>
      </div>
      <div class="tag-input-group">
        <input
          type="text"
          [(ngModel)]="newTag"
          (keyup.enter)="addTag()"
          (input)="tagError=''"
          [placeholder]="'project.step.info.tagsPlaceholder' | translate"
          class="tag-input"
          [class.tag-input-error]="tagError"
        />
        <button type="button" class="btn-add-tag" (click)="addTag()">{{ 'project.step.info.addTag' | translate }}</button>
      </div>
      <p class="tag-error-msg" *ngIf="tagError">⚠ {{ tagError }}</p>
    </div>
  </div>

  <!-- Resumen -->
  <div class="form-group">
    <label for="summary">{{ 'project.step.info.summary' | translate }}</label>
    <textarea
      id="summary"
      [(ngModel)]="formData.summary"
      (ngModelChange)="onInputChange()"
      rows="4"
      [placeholder]="'project.step.info.summaryPlaceholder' | translate"
      class="form-control"
      required
    ></textarea>
    <small class="char-count">{{ formData.summary.length }}/500</small>
  </div>
</div>
