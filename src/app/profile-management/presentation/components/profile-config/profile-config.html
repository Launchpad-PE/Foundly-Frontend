<div class="step-card">
  <div class="step-header">
    <h1 class="main-title">{{ 'onboarding.configTitle' | translate }}</h1>
  </div>

  <div class="step-content">
    <div class="form-group">
      <label for="username">{{ 'onboarding.profileName' | translate }}</label>
      <input
        type="text"
        id="username"
        [(ngModel)]="username"
        [placeholder]="'onboarding.profileNamePlaceholder' | translate"
        class="text-input"
        (ngModelChange)="emitUpdate()"
      />
      <p class="input-hint">{{ 'onboarding.profileNameHint' | translate }}</p>
    </div>
  </div>

  <div class="card-footer">
    <button
      class="continue-button"
      (click)="onSubmit()"
      [disabled]="!username.trim()"
    >
      {{ 'common.save' | translate }}
    </button>
  </div>
</div>
