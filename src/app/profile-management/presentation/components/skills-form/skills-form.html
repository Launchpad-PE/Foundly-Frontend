<div class="step-card">
  <div class="step-header">
    <h1 class="main-title">{{ 'onboarding.skillsTitle' | translate }}</h1>
    <p class="subtitle">{{ 'onboarding.skillsSubtitle' | translate }}</p>
  </div>

  <div class="step-content">
    <!-- Skills Section -->
    <div class="section">
      <label class="section-label">{{ 'onboarding.writeSkill' | translate }}</label>
      <div class="add-skill">
        <input
          type="text"
          [(ngModel)]="newSkill"
          [placeholder]="'onboarding.skillPlaceholder' | translate"
          class="skill-input"
          (keyup.enter)="addSkill()"
        />
        <button class="add-btn" (click)="addSkill()">{{ 'common.add' | translate }}</button>
      </div>

      <div class="skills-list">
        <span *ngFor="let skill of modelValue.abilities" class="skill-tag">
          {{ skill }}
          <button class="remove-skill" (click)="removeSkill(skill)">✕</button>
        </span>
      </div>
    </div>

    <!-- Experiences Section -->
    <div class="section">
      <label class="section-label">{{ 'onboarding.addExperience' | translate }}</label>

      <div *ngIf="!showExperienceForm" class="add-experience-btn">
        <button (click)="showExperienceForm = true">{{ 'onboarding.addExperienceBtn' | translate }}</button>
      </div>

      <div *ngIf="showExperienceForm" class="experience-form">
        <input
          type="text"
          [(ngModel)]="newExperience.title"
          [placeholder]="'onboarding.expTitlePlaceholder' | translate"
          class="exp-input"
        />
        <input
          type="text"
          [(ngModel)]="newExperience.company"
          [placeholder]="'onboarding.expCompanyPlaceholder' | translate"
          class="exp-input"
        />
        <input
          type="text"
          [(ngModel)]="newExperience.period"
          [placeholder]="'onboarding.expPeriodPlaceholder' | translate"
          class="exp-input"
        />
        <div class="exp-actions">
          <button class="cancel-btn" (click)="showExperienceForm = false">{{ 'common.cancel' | translate }}</button>
          <button class="save-btn" (click)="addExperience()">{{ 'common.save' | translate }}</button>
        </div>
      </div>

      <div class="experiences-list">
        <div *ngFor="let exp of modelValue.experiences; let i = index" class="experience-item">
          <div class="exp-info">
            <strong>{{ exp.title }}</strong> | {{ exp.company }} | {{ exp.period }}
          </div>
          <button class="remove-exp" (click)="removeExperience(i)">✕</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card-footer">
    <button class="back-button" (click)="prev.emit()">Atrás</button>
    <button class="continue-button" (click)="onSubmit()">
      {{ 'common.save' | translate }}
    </button>
  </div>
</div>
