<div class="step-card">
  <div class="step-header">
    <h1 class="main-title">{{ 'onboarding.roleTitle' | translate }}</h1>
    <p class="subtitle">{{ 'onboarding.roleSubtitle' | translate }}</p>
  </div>

  <div class="step-content">
    <div class="role-options">
      <div
        *ngFor="let role of predefinedRoles"
        class="role-card"
        [class.selected]="modelValue.selectedRole === role"
        (click)="selectRole(role)"
      >
        {{ role }}
      </div>
    </div>

    <div class="custom-role-section">
      <label class="custom-role-label">{{ 'onboarding.customRole' | translate }}</label>
      <input
        type="text"
        [(ngModel)]="customRoleValue"
        [placeholder]="'onboarding.customRolePlaceholder' | translate"
        class="custom-role-input"
        (ngModelChange)="updateCustomRole($event)"
      />
    </div>

    <p class="info-message">
      {{ 'onboarding.roleHint' | translate }}
    </p>
  </div>

  <div class="card-footer">
    <button class="back-button" (click)="prev.emit()">Atrás</button>
    <button
      class="continue-button"
      (click)="onSubmit()"
      [disabled]="!modelValue.selectedRole && !modelValue.customRole"
    >
      {{ 'common.save' | translate }}
    </button>
  </div>
</div>
