<header class="toolbar" *ngIf="showToolbar">
  <div class="logo" (click)="goToHome()">
    <h1>Foundly</h1>
  </div>
  <nav class="nav-menu">
    <a
      routerLink="/home"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-link">
      {{ 'nav.home' | translate }}
    </a>
    <a
      routerLink="/projects"
      routerLinkActive="active"
      class="nav-link">
      {{ 'nav.projects' | translate }}
    </a>
    <a
      routerLink="/collaborators"
      routerLinkActive="active"
      class="nav-link">
      {{ 'nav.collaborators' | translate }}
    </a>
    <a
      routerLink="/messages"
      routerLinkActive="active"
      class="nav-link">
      {{ 'nav.messages' | translate }}
    </a>
  </nav>
  <div class="user-actions">
    <div class="lang-switch">
      <button type="button" class="lang-btn" [class.active]="lang() === 'es'" (click)="setLang('es')">ES</button>
      <button type="button" class="lang-btn" [class.active]="lang() === 'en'" (click)="setLang('en')">EN</button>
    </div>
    <div class="user-avatar" (click)="goToProfile()" [title]="'nav.profile' | translate">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </div>
  </div>
</header>
