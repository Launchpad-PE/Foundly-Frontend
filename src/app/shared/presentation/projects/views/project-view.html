<!-- project-view.html -->
<div class="projects-container">
  <!-- Main Content -->
  <div class="main-content">
    <!-- Tabs -->
    <div class="tabs-container">
      <button
        class="tab-btn"
        [class.active]="activeTab === 'my-projects'"
        (click)="setActiveTab('my-projects')">
        {{ 'projects.myProjects' | translate }}
      </button>
      <button
        class="tab-btn"
        [class.active]="activeTab === 'participated'"
        (click)="setActiveTab('participated')">
        {{ 'projects.participated' | translate }}
      </button>
    </div>

    <!-- Search Bar -->
    <div class="search-section">
      <input
        type="text"
        [(ngModel)]="searchTerm"
        (keyup.enter)="onSearch()"
        [placeholder]="'projects.searchPlaceholder' | translate"
        class="search-input"
      />
      <button class="btn-search" (click)="onSearch()">
        <span class="search-icon">🔍</span>
        {{ 'common.search' | translate }}
      </button>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading()" class="loading-state">
      <div class="spinner"></div>
      <p>{{ 'projects.loading' | translate }}</p>
    </div>

    <!-- Empty State -->
    <div *ngIf="!loading() && getCurrentProjects().length === 0" class="empty-state">
      <div class="empty-icon">📁</div>
      <h3 *ngIf="activeTab === 'my-projects'">{{ 'projects.noMyProjects' | translate }}</h3>
      <h3 *ngIf="activeTab === 'participated'">{{ 'projects.noParticipated' | translate }}</h3>
      <p *ngIf="activeTab === 'my-projects'">{{ 'projects.noMyProjectsHint' | translate }}</p>
      <p *ngIf="activeTab === 'participated'">{{ 'projects.noParticipatedHint' | translate }}</p>
      <button *ngIf="activeTab === 'my-projects'" class="btn-primary" (click)="createNewProject()">
        {{ 'projects.createBtn' | translate }}
      </button>
      <button *ngIf="activeTab === 'participated'" class="btn-primary" (click)="goToHome()">
        {{ 'projects.explore' | translate }}
      </button>
    </div>

    <!-- Projects Grid -->
    <div *ngIf="!loading() && getCurrentProjects().length > 0" class="projects-grid">
      <app-my-projects
        *ngFor="let project of getCurrentProjects()"
        [project]="getProjectForCard(project)"
        (viewDetails)="viewProjectDetails($event)"
        (apply)="applyToProject($event)">
      </app-my-projects>
    </div>
  </div>

  <!-- Floating Action Button (solo para mis proyectos) -->
  <button
    *ngIf="activeTab === 'my-projects'"
    class="fab"
    (click)="createNewProject()"
    [title]="'projects.createBtn' | translate">
    <span class="fab-icon">+</span>
  </button>
</div>
