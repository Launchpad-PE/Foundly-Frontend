<!-- collaborator-card.component.html -->
<div class="collaborator-card">
  <div class="collaborator-avatar" [style.background]="avatarGradient">
    {{ initials }}
  </div>
  <div class="collaborator-info">
    <p class="collaborator-name">{{ collaborator.name }}</p>
    <p class="collaborator-role">{{ collaborator.role }}</p>
  </div>
</div>
