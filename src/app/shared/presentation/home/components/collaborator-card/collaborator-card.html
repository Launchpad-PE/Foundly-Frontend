<!-- collaborator-card.html -->
<div class="collab-card" (click)="onViewProfile()">
  <div class="collab-avatar">{{ initials }}</div>
  <div class="collab-info">
    <p class="collab-name">{{ displayName }}</p>
    <p class="collab-role">{{ collaborator.role }}</p>
    <div class="collab-skills" *ngIf="collaborator.skills?.length">
      <span *ngFor="let skill of collaborator.skills.slice(0, 3)" class="collab-skill">{{ skill }}</span>
      <span class="collab-skill more" *ngIf="collaborator.skills.length > 3">+{{ collaborator.skills.length - 3 }}</span>
    </div>
  </div>
  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" class="collab-arrow">
    <path d="M6 3l5 5-5 5"/>
  </svg>
</div>
