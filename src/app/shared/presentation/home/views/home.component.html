<!-- home.component.html -->
<div class="home-container">
  <!-- Search Bar -->
  <div class="search-bar-wrapper">
    <div class="search-bar">
      <label class="search-field">
        <svg class="field-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="9" r="6"/><path d="M15 15l3 3"/>
        </svg>
        <input type="text" [(ngModel)]="searchTerm" placeholder="Nombre o palabra clave" class="field-input"/>
      </label>
      <div class="search-divider"></div>
      <label class="search-field">
        <svg class="field-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10 2a6 6 0 016 6c0 4-6 10-6 10S4 12 4 8a6 6 0 016-6z"/><circle cx="10" cy="8" r="2"/>
        </svg>
        <select [(ngModel)]="filterRole" class="field-input field-select">
          <option value="">Tipo de puesto</option>
          <option value="desarrollador-ux">Desarrollador UX</option>
          <option value="desarrollador-frontend">Desarrollador Frontend</option>
          <option value="desarrollador-backend">Desarrollador Backend</option>
          <option value="analista">Analista de datos</option>
          <option value="disenador">Diseñador UI/UX</option>
          <option value="product-manager">Product Manager</option>
        </select>
      </label>
      <div class="search-divider"></div>
      <label class="search-field">
        <svg class="field-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="14" height="14" rx="3"/><path d="M7 10h6M7 7h4"/>
        </svg>
        <select [(ngModel)]="filterArea" class="field-input field-select">
          <option value="">Área</option>
          <option value="tecnologia">Tecnología</option>
          <option value="finanzas">Finanzas</option>
          <option value="salud">Salud</option>
          <option value="energia">Energía</option>
          <option value="educacion">Educación</option>
        </select>
      </label>
      <button class="btn-search" (click)="onSearch()">Buscar</button>
    </div>
  </div>

  <!-- Main 3-column layout -->
  <div class="main-content">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <section class="sidebar-card">
        <h3 class="sidebar-title">Colaboradores destacados</h3>
        <div class="collaborators-list">
          <app-collaborator-card
            *ngFor="let collaborator of highlightedCollaborators"
            [collaborator]="collaborator"
            (viewProfile)="viewProfile($event)">
          </app-collaborator-card>
          <div *ngIf="highlightedCollaborators.length === 0" class="empty-message">
            No hay colaboradores registrados
          </div>
        </div>
        <a routerLink="/collaborators" class="view-more-btn">Ver más</a>
      </section>

      <section class="sidebar-card plan-card">
        <h3 class="sidebar-title">Plan Actual</h3>
        <div class="plan-circle">
          <span class="plan-label">Plan</span>
          <span class="plan-name">{{ currentPlan }}</span>
        </div>
      </section>
    </aside>

    <!-- Projects Feed -->
    <main class="projects-feed">
      <h2 class="feed-title">Lista de proyectos</h2>
      <div class="projects-list" *ngIf="allProjects.length > 0; else emptyFeed">
        <app-project-card
          *ngFor="let project of allProjects"
          [project]="project"
          [isParticipating]="isParticipatingIn(project.id)"
          (viewDetails)="viewProjectDetails($event)"
          (apply)="applyToProject($event)">
        </app-project-card>
      </div>
      <ng-template #emptyFeed>
        <div class="empty-state">
          <div class="empty-icon">📋</div>
          <p class="empty-title">No hay proyectos disponibles</p>
          <p class="empty-sub">Aún no hay proyectos publicados en los que puedas participar.</p>
        </div>
      </ng-template>
    </main>

    <!-- Right Sidebar -->
    <aside class="featured-sidebar sidebar-card">
      <h3 class="sidebar-title centered">Proyectos Destacados</h3>
      <div class="featured-list" *ngIf="featuredProjects.length > 0; else emptyFeatured">
        <app-project-card
          *ngFor="let project of featuredProjects"
          [project]="project"
          [isCompact]="true"
          (viewDetails)="viewProjectDetails($event)">
        </app-project-card>
      </div>
      <ng-template #emptyFeatured>
        <p class="no-featured">Sin proyectos destacados por el momento.</p>
      </ng-template>
    </aside>
  </div>
</div>
