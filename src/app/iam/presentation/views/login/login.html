<header class="login-header">
  <div class="header-content">
    <div class="logo">
      <img src="/logo.png" alt="Foundly" class="logo-image" />
    </div>
    <div class="right-container">
      <button class="back-button" (click)="goBack()">← Volver</button>
    </div>
  </div>
</header>

<div class="login-container">
  <div class="login-card">
    <div class="login-card-header">
      <h1 class="logo-text">Foundly</h1>
      <p class="login-subtitle">Inicia sesión para continuar</p>
    </div>

    <!-- Error -->
    <div *ngIf="loginError()" class="error-message">
      ⚠ {{ loginError() }}
    </div>

    <!-- Loading -->
    <div *ngIf="userStore.loading()" class="loading-state">
      <div class="loading-spinner"></div>
      <span>Iniciando sesión...</span>
    </div>

    <form (ngSubmit)="handleLogin()" class="login-form" [class.disabled]="userStore.loading()">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" [(ngModel)]="email" name="email"
               placeholder="email@example.com" required class="form-input"
               [disabled]="userStore.loading()" />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" [(ngModel)]="password" name="password"
               placeholder="Tu contraseña" required class="form-input"
               [disabled]="userStore.loading()" />
      </div>

      <div class="forgot-password">
        <a href="#" (click)="openForgotPasswordModal(); $event.preventDefault()">
          ¿Olvidaste tu contraseña?
        </a>
      </div>

      <button
        type="submit"
        class="login-button"
        [disabled]="userStore.loading() || !email || !password"
      >
        {{ userStore.loading() ? 'Iniciando sesión...' : 'Iniciar sesión' }}
      </button>
    </form>

    <div class="register-link">
      <p>¿No tienes cuenta?
        <a href="#" (click)="goToRegister(); $event.preventDefault()">Regístrate</a>
      </p>
    </div>

    <div class="footer">
      <p>Todos los derechos reservados Foundly © 2026</p>
    </div>
  </div>
</div>

<app-modal-forget-password
  [(visible)]="showForgotPasswordModal"
  (submitEmail)="handlePasswordRecovery($event)"
/>
