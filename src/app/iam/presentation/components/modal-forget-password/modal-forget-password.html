<div *ngIf="visible" class="modal-overlay" (click)="close()">
  <div class="modal-dialog" (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="modal-header">
      <h2 class="modal-title">{{ 'forgotPassword.title' | translate }}</h2>
      <button class="modal-close" (click)="close()">✕</button>
    </div>

    <!-- Content -->
    <div class="modal-content">
      <p class="instruction-text">
        {{ 'forgotPassword.instruction' | translate }}
      </p>

      <div class="field">
        <input
          type="email"
          [(ngModel)]="recoveryEmail"
          placeholder="email@example.com"
          class="email-input"
          [class.invalid]="emailError"
          (ngModelChange)="clearError()"
        />
        <small *ngIf="emailError" class="error-text">{{ emailError }}</small>
      </div>
    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <button
        class="send-button"
        [disabled]="!recoveryEmail"
        (click)="handleSubmit()"
      >
        {{ 'forgotPassword.send' | translate }}
      </button>
    </div>
  </div>
</div>
